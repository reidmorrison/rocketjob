name: Test

on:
  - push
  - pull_request

jobs:
  lint:
    name: "RuboCop"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          # runs 'bundle install' and caches installed gems automatically
          bundler-cache: true

      - name: Run RuboCop
        run: bundle exec rubocop

  test:
    name: "Test: Mongoid ${{ matrix.mongoid }} on Ruby ${{ matrix.ruby }}"
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
    strategy:
      fail-fast: false
      matrix:
        include:
          - mongoid: "8.1"
            ruby: "3.2"

          - mongoid: "9.0"
            ruby: "3.4"

          - mongoid: "9.1"
            ruby: "4.0"

          # Non-blocking: JRuby support is best-effort (see :jruby gems in Appraisals).
          - mongoid: "9.0"
            ruby: "jruby-10.0"
            experimental: true

    env:
      BUNDLE_GEMFILE: gemfiles/mongoid_${{ matrix.mongoid }}.gemfile
      DISPLAY: ":99.0"

    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby
        # JRuby is best-effort: swallow install failures so the entry never blocks.
        continue-on-error: ${{ matrix.experimental || false }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          # runs 'bundle install' and caches installed gems automatically
          bundler-cache: true

      - name: Gemfile
        run: echo $BUNDLE_GEMFILE

      - name: Ruby Version
        run: ruby --version

      - name: Run Tests
        continue-on-error: ${{ matrix.experimental || false }}
        run: bundle exec rake test
