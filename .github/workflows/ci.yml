name: Test

on:
  - push
  - pull_request

jobs:
  lint:
    name: "RuboCop"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          # runs 'bundle install' and caches installed gems automatically
          bundler-cache: true

      - name: Run RuboCop
        run: bundle exec rubocop

  test:
    name: "Test: Mongoid ${{ matrix.mongoid }} on Ruby ${{ matrix.ruby }}"
    runs-on: ubuntu-latest
    permissions:
      # To push the coverage badge to the badges branch.
      contents: write
    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
    strategy:
      fail-fast: false
      matrix:
        include:
          - mongoid: "8.1"
            ruby: "3.2"

          # Measure coverage on this entry only.
          - mongoid: "9.0"
            ruby: "3.4"
            coverage: true

          - mongoid: "9.1"
            ruby: "4.0"

          # Non-blocking: JRuby support is best-effort (see :jruby gems in Appraisals).
          - mongoid: "9.0"
            ruby: "jruby-10.0"
            experimental: true

    env:
      BUNDLE_GEMFILE: gemfiles/mongoid_${{ matrix.mongoid }}.gemfile
      DISPLAY: ":99.0"

    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby
        # JRuby is best-effort: swallow install failures so the entry never blocks.
        continue-on-error: ${{ matrix.experimental || false }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          # runs 'bundle install' and caches installed gems automatically
          bundler-cache: true

      - name: Gemfile
        run: echo $BUNDLE_GEMFILE

      - name: Ruby Version
        run: ruby --version

      - name: Run Tests
        continue-on-error: ${{ matrix.experimental || false }}
        run: bundle exec rake test

      - name: Publish Coverage Badge
        if: ${{ matrix.coverage && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Write a shields.io endpoint file from SimpleCov's summary.
          mkdir "$RUNNER_TEMP/badges"
          ruby -rjson -e '
            percent = JSON.parse(File.read("coverage/.last_run.json")).dig("result", "line")
            color   = {90 => "brightgreen", 80 => "green", 70 => "yellow", 60 => "orange"}.find { |min, _| percent >= min }&.last || "red"
            badge   = {schemaVersion: 1, label: "coverage", message: format("%.1f%%", percent), color: color}
            File.write(ARGV[0], JSON.generate(badge))
          ' "$RUNNER_TEMP/badges/coverage.json"
          # Replace the badges branch with a single commit so that it never accumulates history.
          cd "$RUNNER_TEMP/badges"
          git init -q -b badges
          git add coverage.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Update coverage badge"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
