# See: https://docs.mongodb.com/mongoid/master/tutorials/mongoid-configuration/
# Below are the client options we run in production where each server has 10 workers each.
client_options: &client_options
  max_pool_size:            50
  min_pool_size:            10
  # Very important to read from the primary mongo node.
  read:
    mode:                   :primary
  connect_timeout:          5
  socket_timeout:           30 # 300 could be useful in prod
  # Includes the time taken to re-establish after a replica-set refresh
  wait_queue_timeout:       125
  server_selection_timeout: 10 # 120 could be useful in prod
  max_read_retries:         20
  read_retry_interval:      3
  max_pool_size:            50
  min_pool_size:            1

mongoid_options: &mongoid_options
  use_utc: true

development:
  clients:
    default: &default_development
      uri: mongodb://127.0.0.1:27017/rocketjob_development
      options:
        <<: *client_options
    rocketjob:
      <<: *default_development
    rocketjob_slices:
      <<: *default_development
  options:
    <<: *mongoid_options

test:
  clients:
    default: &default_test
      <%
        # The tests drop the collections of this database when they start. So each git worktree, whose .git is a
        # file rather than a directory, gets a database of its own, named after its directory, and the tests of
        # worktrees that run at the same time do not drop each other's collections. The main checkout, and CI, use
        # rocketjob_test. Set ROCKETJOB_TEST_DATABASE to choose another. This file is loaded from the root of the
        # repository, so that is the current directory.
        require "digest"
        test_database = ENV["ROCKETJOB_TEST_DATABASE"].to_s.strip
        if test_database.empty?
          root          = Dir.pwd
          test_database =
            if File.file?(File.join(root, ".git"))
              name = File.basename(root).gsub(/[^A-Za-z0-9_-]/, "_")[0, 30]
              "rocketjob_test_#{name}_#{Digest::SHA256.hexdigest(root)[0, 6]}"
            else
              "rocketjob_test"
            end
        end
      %>
      uri: mongodb://127.0.0.1:27017/<%= test_database %>
      options:
        <<: *client_options
    rocketjob:
      <<: *default_test
    rocketjob_slices:
      <<: *default_test
  options:
    <<: *mongoid_options
